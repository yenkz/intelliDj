[project]
name = "intellidj"
version = "0.1.0"
description = "DJing tools to select, download, organize and enrich music"
authors = [{name = "yenkz", email = "cpecile@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "beets",
    "slskd-api",
    "typing_extensions",
    "requests",
    "mutagen",
    "streamlit",
    "python-dotenv",
    "pyacoustid>=1.3.0",
    "spotipy>=2.23.0",
]

[project.optional-dependencies]
audio-analysis = ["essentia"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.uv]
package = false

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
